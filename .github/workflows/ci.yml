name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:lua
      - run: npm run test:steam-package
      - run: npm run test:runtime
      - run: npm run test:input
      - name: Test Steam installer
        shell: pwsh
        run: ./tests/test-install.ps1
      - name: Test APK injection
        shell: pwsh
        run: ./tests/test-build.ps1
